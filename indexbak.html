<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema SOS Municipal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#dc2626">
</head>
<body>
  <main class="container">
    <img src="logo.png" class="logo" alt="VS&TI">
    <h1>Sistema SOS Municipal</h1>

    <div id="status" class="status-pill">Lista para usar</div>

    <section id="homePanel" class="home-panel">
      <button id="sosButton" type="button" aria-label="Activar SOS">
        SOS
      </button>
      <p class="helper-text">
        Presiona el botón en caso de emergencia.
      </p>
    </section>

    <section id="categoryPanel" class="category-panel" hidden>
      <h2>¿Qué tipo de emergencia quieres reportar?</h2>
      <p class="helper-text">
        Selecciona una categoría y luego confirma el envío.
      </p>

      <div class="emergency-grid">
        <button class="emergency-option active" type="button" data-type="SOS_MANUAL">
          <span class="emoji">🚨</span>
          <span>SOS General</span>
        </button>

        <button class="emergency-option" type="button" data-type="MEDICAL">
          <span class="emoji">🚑</span>
          <span>Médica</span>
        </button>

        <button class="emergency-option" type="button" data-type="FIRE">
          <span class="emoji">🔥</span>
          <span>Incendio</span>
        </button>

        <button class="emergency-option" type="button" data-type="SECURITY">
          <span class="emoji">👮</span>
          <span>Seguridad</span>
        </button>

        <button class="emergency-option" type="button" data-type="VIF">
          <span class="emoji">🏠</span>
          <span>VIF</span>
        </button>

        <button class="emergency-option" type="button" data-type="TRAFFIC_ACCIDENT">
          <span class="emoji">🚗</span>
          <span>Accidente</span>
        </button>

        <button class="emergency-option" type="button" data-type="URBAN_RISK">
          <span class="emoji">⚠️</span>
          <span>Riesgo</span>
        </button>

        <button class="emergency-option" type="button" data-type="OTHER">
          <span class="emoji">📝</span>
          <span>Otro</span>
        </button>
      </div>

      <button id="confirmButton" class="primary-action" type="button">
        Enviar alerta
      </button>

      <button id="backButton" class="secondary-action" type="button">
        Volver
      </button>
    </section>

    <button id="cancelButton" class="danger-secondary" type="button" hidden>
      Cancelar alerta
    </button>

    <section class="info" aria-label="Información de alerta">
      <div>GPS: <span id="gpsStatus">pendiente</span></div>
      <div>Precisión: <span id="accuracy">-</span></div>
      <div>Estado: <span id="eventStatus">NORMAL</span></div>
      <div>Evento: <span id="eventId">-</span></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
